test = [
    { name = "bootstrap",  harness = false },
    { name = "basic_boot", harness = false },
    { name = "checks",     harness = false },
]

[package]
name = "ab-os-bel"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.6.0"
multiboot2 = { version = "0.23.1", default-features = false, features = ["unstable"] }
spin = "0.9.8"

[[bin]]
name = "ab-os-bel"
test = false

[lib]
test = false
doctest = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
style    = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
